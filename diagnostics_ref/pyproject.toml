[project]
name = "robotdx-diagnostics-ref"
version = "0.0.1"
description = "Reference implementation of robotdx.diagnostics: stock diagnostics as pure functions (config, data) -> Result, for RobotDx to lift into io-diagnostics"
requires-python = ">=3.11"
# WHY numpy is the one runtime dependency (Zach's "zero or one runtime dep" rule for cores): every stock diagnostic is
# arithmetic over arrays. record.py, core.py and registry.py stay stdlib-only.
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robotdx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
