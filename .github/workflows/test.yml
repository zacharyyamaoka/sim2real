name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # WHY a file list: most suites read rig checkouts (bam_ws, bam_rack_twin, data-ui, pidtuna) that exist only on the dev
      # box. These are the files proved (2026-11-23) to pass against the installed wheel without them.
      - run: uv run --isolated --no-sources --python ${{ matrix.python }} --extra sim --extra vision --extra homing --extra test python -m pytest -q $(grep -v '^#' .github/portable-tests.txt)
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: "1"
