name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # WHY a file list: most suites read rig checkouts (bam_ws, bam_rack_twin, data-ui, pidtuna) that exist only on the dev
      # box. These are the files proved (2026-11-23) to pass against the installed wheel without them.
      # WHY uv pip, not `uv run --isolated` (2026-11-25, CI red): uv run resolves EVERY extra for every platform, so one
      # unpublished extra (trajectories -> robot-trajectories, not on PyPI) failed the job before a test ran. Installing just
      # these extras from PyPI is what a user's `pip install sim2real[...]` does.
      - run: uv venv --python ${{ matrix.python }} .venv && uv pip install --no-sources ".[sim,vision,homing,test]"
      - run: .venv/bin/python -m pytest -q $(grep -v '^#' .github/portable-tests.txt)
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: "1"
